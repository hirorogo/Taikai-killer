<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taikai-killer — dashboard-lite (read-only)</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body { margin: 0; padding: 1.25rem; line-height: 1.5; }
      h1 { font-size: 1.25rem; margin: 0 0 0.25rem; }
      .sub { color: #888; font-size: 0.85rem; margin: 0 0 1.25rem; }
      section { margin-bottom: 2rem; }
      h2 { font-size: 1rem; border-bottom: 1px solid #8884; padding-bottom: 0.25rem; }
      table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
      th, td { text-align: left; padding: 0.35rem 0.6rem; border-bottom: 1px solid #8883; }
      th { font-weight: 600; color: #888; }
      td.num { text-align: right; font-variant-numeric: tabular-nums; }
      a { color: #4ea1ff; cursor: pointer; text-decoration: none; }
      a:hover { text-decoration: underline; }
      .badge { display: inline-block; padding: 0 0.4rem; border-radius: 0.5rem; font-size: 0.7rem; }
      .ok { background: #2e7d3233; color: #4caf50; }
      .none { background: #88888833; color: #999; }
      .empty { color: #999; font-style: italic; }
      pre {
        background: #8881; padding: 0.75rem; border-radius: 0.4rem;
        overflow: auto; font-size: 0.78rem; max-height: 24rem;
      }
      .detail { margin-top: 0.75rem; }
      .err { color: #e57373; }
    </style>
  </head>
  <body>
    <h1>Taikai-killer — dashboard-lite</h1>
    <p class="sub">read-only / node 標準のみ / 自前最小ダッシュボード（参考用 speca とは別）</p>

    <section>
      <h2>Leaderboard</h2>
      <div id="leaderboard">loading…</div>
    </section>

    <section>
      <h2>Runs</h2>
      <div id="runs">loading…</div>
    </section>

    <section id="detail-section" hidden>
      <h2 id="detail-title">Run detail</h2>
      <div class="detail">
        <strong>result.json</strong>
        <pre id="detail-result"></pre>
      </div>
      <div class="detail">
        <strong>events/pipeline.jsonl</strong>
        <pre id="detail-events"></pre>
      </div>
    </section>

    <script>
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s).replace(/[&<>"]/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]),
        );

      async function getJson(url) {
        const r = await fetch(url);
        if (!r.ok) throw new Error(url + " -> " + r.status);
        return r.json();
      }

      function num(v) {
        return v === undefined || v === null ? "" : v;
      }

      async function loadLeaderboard() {
        const el = $("leaderboard");
        try {
          const rows = await getJson("/api/leaderboard");
          if (!rows.length) {
            el.innerHTML = '<p class="empty">leaderboard.json が空です</p>';
            return;
          }
          // score 降順で見やすく（同点は元の順）
          rows.sort((a, b) => (b.score ?? 0) - (a.score ?? 0));
          const body = rows
            .map(
              (e) => `<tr>
                <td>${esc(e.run_id)}</td>
                <td>${esc(e.strategy_id)}</td>
                <td>${esc(e.rubric_ref)}</td>
                <td class="num">${num(e.score)}</td>
                <td class="num">${num(e.passed_test_ratio)}</td>
                <td>${esc(e.ts ?? "")}</td>
              </tr>`,
            )
            .join("");
          el.innerHTML = `<table>
            <thead><tr><th>run</th><th>strategy</th><th>rubric</th>
              <th>score</th><th>pass ratio</th><th>ts</th></tr></thead>
            <tbody>${body}</tbody></table>`;
        } catch (err) {
          el.innerHTML = `<p class="err">${esc(err.message)}</p>`;
        }
      }

      async function loadRuns() {
        const el = $("runs");
        try {
          const runs = await getJson("/api/runs");
          if (!runs.length) {
            el.innerHTML = '<p class="empty">run がありません</p>';
            return;
          }
          const body = runs
            .map(
              (r) => `<tr>
                <td><a data-run="${esc(r.id)}">${esc(r.id)}</a></td>
                <td>${r.hasResult ? '<span class="badge ok">result</span>' : '<span class="badge none">no result</span>'}</td>
                <td>${r.hasEvents ? '<span class="badge ok">events</span>' : '<span class="badge none">no events</span>'}</td>
              </tr>`,
            )
            .join("");
          el.innerHTML = `<table>
            <thead><tr><th>run id</th><th>result</th><th>events</th></tr></thead>
            <tbody>${body}</tbody></table>`;
          el.querySelectorAll("a[data-run]").forEach((a) =>
            a.addEventListener("click", () => showDetail(a.dataset.run)),
          );
        } catch (err) {
          el.innerHTML = `<p class="err">${esc(err.message)}</p>`;
        }
      }

      async function showDetail(id) {
        $("detail-section").hidden = false;
        $("detail-title").textContent = "Run detail — " + id;
        const rEl = $("detail-result");
        const eEl = $("detail-events");
        rEl.textContent = "loading…";
        eEl.textContent = "loading…";
        try {
          const result = await getJson(
            "/api/runs/" + encodeURIComponent(id) + "/result",
          );
          rEl.textContent = result === null ? "(no result.json)" : JSON.stringify(result, null, 2);
        } catch (err) {
          rEl.textContent = err.message;
        }
        try {
          const events = await getJson(
            "/api/runs/" + encodeURIComponent(id) + "/events",
          );
          eEl.textContent = events.length
            ? events.map((e) => JSON.stringify(e)).join("\n")
            : "(no events)";
        } catch (err) {
          eEl.textContent = err.message;
        }
        $("detail-section").scrollIntoView({ behavior: "smooth" });
      }

      loadLeaderboard();
      loadRuns();
    </script>
  </body>
</html>
